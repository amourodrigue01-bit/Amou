<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <label class="label" for="text">Text:</label>
    <input class="input" type="text" id="text" name="text" placeholder="Enter text here">
    

    <label class="label" for="password">mot de passe:</label>
    <input class="input" type="password" id="password" name="password" placeholder="Enter password here">


    <label class="label" for="email">Email:</label>
    <input class="input" type="email" id="email" name="email" placeholder="Enter email here">


    <label class="label" for="number">Number:</label>
    <input class="input" type="number" id="number" name="number" placeholder="123456">
    </div>

    <div class="container1">
    <label class="label" for="checkbox">Vrais:</label>
    <input class="input" type="checkbox" id="checkbox" name="checkbox" value="option1">
    <label class="label" for="checkbox2">Faux:</label>
    <input class="input" type="checkbox" id="checkbox2" name="checkbox" value="option2">


    <label class="label" for="radio1">Vrais:</label>
    <input class="input" type="radio" id="radio1" name="radio" value="option1">
    <label class="label" for="radio2">Faux:</label>
    <input class="input" type="radio" id="radio2" name="radio" value="option2">
    </div>

    <div class="container2">
    <label class="label" for="date">Date:</label>
    <input class="input" type="date" id="date" name="date">


    <label class="label" for="time">Time:</label>
    <input class="input" type="time" id="time" name="time">


    <label class="label" for="datetime-local">Date and Time:</label>
    <input class="input" type="datetime-local" id="datetime-local" name="datetime-local">
    </div>

    <div class="container3">
    <label class="label" for="color">Color:</label>
    <input class="input" type="color" id="color" name="color">


    <label class="label" for="file">File:</label>
    <input class="input" type="file" id="file" name="file">


    <label class="label" for="search">Search:</label>
    <input class="input" type="search" id="search" name="search" placeholder="Enter search term here">


    <label class="label" for="range">Range:</label>
    <input class="input" type="range" id="range" name="range">

    </div>

    <div class="container4">
    <label class="label" for="url">URL:</label>
    <input class="input" type="url" id="url" name="url" placeholder="Enter URL here">

    <label class="label" for="tel">Telephone:</label>
    <input class="input" type="tel" id="tel" name="tel" placeholder="+1 (555) 555-5555">
    </div>

    <div class="container5">
    <label class="label" for="button">Click Me</label>
    <input class="input" type="button" id="button" name="button" value="Click Me">

    <label class="label" for="submit">Submit</label>
    <input class="input" type="submit" id="submit" name="submit" value="Submit">

    <label class="label" for="reset">Reset</label>
    <input class="input" type="reset" id="reset" name="reset" value="Reset">
    </div>

    <div class="container6">
    <label class="label" for="week">Week</label>
    <input class="input" type="week" id="week" name="week">

    <label class="label" for="month">Month</label>
    <input class="input" type="month" id="month" name="month">
    </div>

    </body>
</html>
